worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;

  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  map $http_x_forwarded_proto $proxy_scheme { default $http_x_forwarded_proto; "" $scheme; }

  upstream api { server api:8000; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    include /etc/nginx/app-server.conf;
  }

  # HTTPS (самоподписанный сертификат): нужен браузерам для доступа к камере по адресу локальной сети
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /tmp/certs/server.crt;
    ssl_certificate_key /tmp/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    include /etc/nginx/app-server.conf;
  }
}
