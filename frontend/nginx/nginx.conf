worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;

  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  map $http_x_forwarded_proto $proxy_scheme { default $http_x_forwarded_proto; "" $scheme; }

  upstream api { server api:8000; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;
    include /etc/nginx/security-headers.conf;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /api/v1/events/stream {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3700s;
      chunked_transfer_encoding on;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      proxy_read_timeout 60s;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
      try_files $uri /index.html;
    }
  }
}
