worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
  open_file_cache max=200 inactive=60s;
  open_file_cache_valid 60s;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=tilereq:10m rate=80r/s;
  # кэш плиток OpenStreetMap: плитки запрашиваются у OSM один раз и дальше отдаются из кэша (политика использования OSM)
  proxy_cache_path /var/cache/tiles levels=1:2 keys_zone=tiles:20m max_size=1g inactive=60d use_temp_path=off;
  map $http_x_forwarded_proto $proxy_scheme { default $http_x_forwarded_proto; "" $scheme; }

  upstream api { server api:8000; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    include /etc/nginx/app-server.conf;
  }

  # HTTPS (самоподписанный сертификат): нужен браузерам для доступа к камере по адресу локальной сети
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /tmp/certs/server.crt;
    ssl_certificate_key /tmp/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    include /etc/nginx/app-server.conf;
  }
}
