root /usr/share/nginx/html;
index index.html;
client_max_body_size 25m;
include /etc/nginx/security-headers.conf;

location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

location = /api/v1/auth/login {
  limit_req zone=login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $proxy_scheme;
  proxy_set_header X-Request-Id $request_id;
}

location = /api/v1/events/stream {
  proxy_pass http://api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $proxy_scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3700s;
  chunked_transfer_encoding on;
}

location /api/ {
  limit_req zone=api burst=40 nodelay;
  limit_req_status 429;
  proxy_pass http://api;
  proxy_read_timeout 60s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $proxy_scheme;
  proxy_set_header X-Request-Id $request_id;
}

# Плитки карты OpenStreetMap через наш сервер: браузер не ходит на tile.openstreetmap.org (там блокируют запросы без Referer
# и приложений без User-Agent), плитки кэшируются на 60 дней, карта продолжает работать при сбоях сети.
location ~ "^/tiles/(\d{1,2})/(\d{1,7})/(\d{1,7})\.png$" {
  limit_req zone=tilereq burst=300 nodelay;
  include /tmp/resolver.conf;
  set $osm_host tile.openstreetmap.org;
  proxy_pass https://$osm_host/$1/$2/$3.png;
  proxy_ssl_server_name on;
  proxy_http_version 1.1;
  proxy_set_header Host tile.openstreetmap.org;
  proxy_set_header User-Agent "AlageumServiceHub/0.1 (service desk map tile cache)";
  proxy_set_header Referer "";
  proxy_set_header Cookie "";
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_cache tiles;
  proxy_cache_valid 200 30d;
  proxy_cache_valid 404 1m;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_lock on;
  add_header X-Tile-Cache $upstream_cache_status;
  add_header Cache-Control "public, max-age=604800";
  add_header X-Content-Type-Options "nosniff" always;
}

# фотографии для оформления: кэшируются в браузере
location /bg/ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
  include /etc/nginx/security-headers.conf;
  try_files $uri =404;
}

location /assets/ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  include /etc/nginx/security-headers.conf;
  try_files $uri =404;
}

location / {
  add_header Cache-Control "no-cache";
  include /etc/nginx/security-headers.conf;
  try_files $uri /index.html;
}
